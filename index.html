       ON NE LÈVE PAS LE VOILE ICI. Je l'avais fait ce matin pour corriger la
       « page grise qui ne part jamais » — et j'ouvrais du même coup la page
       protégée à quiconque n'est PAS autorisé : visiteur sans session, compte
       sans rôle sur le projet, ou simple panne réseau. Le verrou doit échouer
       FERMÉ. Le voile ne se lève qu'en un seul endroit, `ouvrir()`, c'est-à-dire
       quand le serveur a confirmé le droit d'entrer.
       Ce qu'on garantit ici, c'est que le formulaire reste ATTEIGNABLE : la
       carte est remontée au-dessus du voile (z-index posé à la création), donc
       on peut toujours se connecter ou lire le message d'erreur. */
    function fermer(){
      /* Pas de session : on montre le formulaire, donc le voile d'attente
         doit tomber. Il n'est PAS levé par `lever()` seul, appelé uniquement
         quand la session s'ouvre — sans cette ligne, un visiteur anonyme
         resterait devant un écran gris. Le voile du VERROU, lui, reste : il
         protège une page où l'on n'est pas entré. */
      leverAttente();
      qtisPastilleRetirer();
      if(!zCarte) return;
      zCarte.style.display='';
      var ligne=zCarte.querySelector('[data-qtis-connecte]');
      if(ligne) ligne.style.display='none';
      Array.prototype.forEach.call(zCarte.children,function(el){
        if(el.getAttribute&&el.getAttribute('data-qtis-connecte')==='1') return;
        montrer(el);
      });
    }

    /* Le cookie et la pastille vivent au niveau du socle (voir
       `qtisCookieJeton` / `qtisPastilleCompte`) : ils servent aussi aux pages
       qui ne portent pas de bloc Connexion. */
    var cookieJeton = qtisCookieJeton;

    function apresSession(sess){
      cookieJeton(sess);
      var u=(sess&&sess.user)||null;
      if(!u){ qtisSessionEmet(null); fermer(); return; }
      /* Rattachement : l’invitation porte une adresse, la session un
         identifiant. C’est ici que les deux se rejoignent. Sans cet appel,
         un invité reste sans rôle et ne voit rien. */
      /* Deux chemins pour obtenir un role, dans cet ordre :
         1. le RATTACHEMENT — une invitation portait cette adresse ;
         2. l'ADHESION LIBRE — le projet l'a ouverte, on entre sans invitation.
         Le second ne fait rien si le projet ne l'a pas activee : c'est la
         base qui tranche, jamais le client. Les deux sont silencieux en cas
         d'echec — un visiteur sans droit voit le message de la page, pas une
         erreur technique. */
      cli.rpc('app_rattacher_membre').then(function(){ return null; }).catch(function(){ return null; })
        .then(function(){
          if(!cfg.projet) return null;
          return cli.rpc('app_rejoindre_projet',{p_projet:cfg.projet}).then(function(){ return null; }).catch(function(){ return null; });
        })
        .then(function(){
          /* Sans projet, aucun rôle à vérifier : la décision est déjà prise.
             Cette branche ne redirigeait pas du tout — une page sans projet
             gardait son visiteur sur l'accueil malgré le réglage. */
          if(!cfg.projet){ qtisSessionEmet(u); if(rediriger()) return; ouvrir(u); return; }
          return cli.rpc('app_mon_role',{p_projet:cfg.projet}).then(function(r){
            var role=(r&&r.data)||'';
            window.__QTIS_ROLE=role;
            /* Membre ou non : c’est le serveur qui l’a dit. On n’ouvre pas
               une page rattachée à un projet à quelqu’un qui n’a aucun rôle.

               La condition portait sur `cfg.lock` — seules les pages VERROUILLÉES
               refusaient. Sur une page ouverte, un non-membre entrait, remplissait
               un formulaire, signait, et n’apprenait qu’à l’enregistrement qu’il
               n’avait pas le droit : sa saisie était perdue. Refuser à la porte
               coûte un message ; refuser à la sortie coûte le travail de
               quelqu’un.

               Si le projet a ouvert l’adhésion libre, `app_rejoindre_projet` a
               déjà accordé le rôle juste au-dessus : ce refus ne concerne donc
               que les projets fermés. */
            if(cfg.projet&&!role){
              dire('Votre compte n’est pas membre de ce projet. Demandez une invitation à son responsable.',true);
              qtisSessionEmet(null); fermer(); return;
            }
            /* L'ordre compte : on part AVANT de réafficher. `ouvrir(u)` levait
               le voile et montrait la ligne « Connecté : … » une fraction de
               seconde, juste avant la navigation. */
            qtisSessionEmet(u); if(rediriger()) return; ouvrir(u);
            /* Le rôle n'a pas pu être lu : on ne redirige pas, et on montre où
               l'on en est. Partir en aveugle mènerait à une page de travail
               qui n'affichera rien, sans dire pourquoi. */
          }).catch(function(){ qtisSessionEmet(u); ouvrir(u); });
        });
    }

    /* Un verrou qui ne se lève jamais transforme une coupure réseau en site
       blanc. Deux garde-fous, parce qu'une promesse peut échouer OU ne jamais
       répondre — et que le premier cas ne couvre pas le second :
         - `.catch` : sans lui, le rejet n'est capté par personne, `apresSession`
           n'est jamais appelée et rien ne lève le voile ;
         - délai de garde : Supabase peut rester muet sans jamais rejeter. */
    var repondu=false;
    function sansSession(msg){
      if(repondu) return; repondu=true;
      qtisSessionEmet(null); fermer();
      if(msg) dire(msg,true);
    }
    /* Le délai est réglable, à un seul usage : permettre au harnais de le
       vérifier sans attendre huit secondes. L'exportateur ne l'émet jamais,
       donc une page publiée prend toujours la valeur par défaut. */
    var _delaiVerrou = parseInt(cfg.delaiVerrou,10) > 0 ? parseInt(cfg.delaiVerrou,10) : 8000;
    setTimeout(function(){ sansSession('Le service de connexion ne répond pas. Réessayez ; si cela persiste, vérifiez la configuration Supabase de la page.'); }, _delaiVerrou);
    cli.auth.getSession()
      .then(function(r){ repondu=true; apresSession(r&&r.data&&r.data.session); })
      .catch(function(e){ sansSession('Connexion indisponible : le service d’authentification est injoignable.'); });
    cli.auth.onAuthStateChange(function(_e,sess){ repondu=true; apresSession(sess); });

    var champId=root.querySelector('.qtis-login-id');
    var champPw=root.querySelector('.qtis-login-pw');
    var btn=root.querySelector('.qtis-login-submit');
    var lienIns=root.querySelector('[data-qtis-signup]');
    var lienMdp=root.querySelector('[data-qtis-reset]');

    function tenter(inscription){
      var mail=(champId&&champId.value||'').trim();
      var mdp=(champPw&&champPw.value)||'';
      if(!mail||!mdp){
        /* Le message seul ne suffisait pas : il s'affiche EN BAS de la carte,
           là où l'œil ne va pas après avoir cliqué sur « Créer un compte ». On
           renvoie donc le curseur sur le champ manquant — le geste attendu
           devient visible au lieu d'être écrit. */
        dire(inscription
          ? 'Pour créer un compte, saisissez d’abord une adresse e-mail et un mot de passe ci-dessus (6 caractères minimum), puis cliquez de nouveau.'
          : 'Adresse et mot de passe requis.', true);
        var cible = !mail ? champId : champPw;
        if(cible && cible.focus) cible.focus();
        return;
      }
      dire(inscription?'Création du compte…':'Connexion…');
      var p=inscription ? cli.auth.signUp({email:mail,password:mdp})
                        : cli.auth.signInWithPassword({email:mail,password:mdp});
      p.then(function(r){
        if(r.error){ dire(qtisAuthMsg(r.error.message),true); return; }
        if(inscription&&!(r.data&&r.data.session)){
          dire('Compte créé. Confirmez votre adresse via l’e-mail reçu, puis connectez-vous.');
          return;
        }
        dire('');
      }).catch(function(e){ dire(String(e.message||e),true); });
    }
    if(btn) btn.addEventListener('click',function(ev){ ev.preventDefault(); tenter(false); });
    if(champPw) champPw.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); tenter(false); } });
    if(lienIns) lienIns.addEventListener('click',function(ev){ ev.preventDefault(); tenter(true); });

    /* ── Mot de passe oublie ────────────────────────────────────────────────
       Deux moments, separes dans le temps :
         1. ICI, on demande a Supabase d'envoyer un courriel de reinitialisation ;
         2. PLUS BAS, au retour du lien recu, la session est ouverte en mode
            « recovery » et on demande le nouveau mot de passe.
       `redirectTo` pointe la page elle-meme : sans cela le visiteur atterrit
       sur l'URL du site et perd son chemin. Cette adresse doit figurer dans les
       URL de redirection autorisees du projet Supabase. */
    if(lienMdp) lienMdp.addEventListener('click',function(ev){
      ev.preventDefault();
      var mail=(champId&&champId.value||'').trim();
      if(!mail||mail.indexOf('@')<1){
        dire('Saisissez d abord votre adresse e-mail ci-dessus, puis cliquez de nouveau.',true);
        try{ champId.focus(); }catch(e){}
        return;
      }
      dire('Envoi du lien...');
      cli.auth.resetPasswordForEmail(mail,{redirectTo:location.href.split('#')[0]}).then(function(r){
        if(r&&r.error){ dire(qtisAuthMsg(r.error.message),true); return; }
        /* Message VOLONTAIREMENT identique que l'adresse existe ou non :
           repondre « compte inconnu » permettrait de savoir qui a un compte. */
        dire('Si un compte existe pour cette adresse, un lien de reinitialisation vient d etre envoye. Pensez aux indesirables.');
      }).catch(function(e){ dire(String(e.message||e),true); });
    });

    /* Retour du courriel : Supabase ouvre une session temporaire et signale
       l'evenement PASSWORD_RECOVERY. On ne laisse PAS entrer directement — on
       demande le nouveau mot de passe, sinon le lien deviendrait une porte
       d'entree permanente tant qu'il n'est pas utilise. */
    try {
      cli.auth.onAuthStateChange(function(evt){
        if(evt!=='PASSWORD_RECOVERY') return;
        var np=window.prompt('Nouveau mot de passe (6 caracteres minimum) :','');
        if(np===null) return;
        np=String(np);
        if(np.length<6){ dire('Mot de passe trop court (6 caracteres minimum).',true); return; }
        dire('Enregistrement...');
        cli.auth.updateUser({password:np}).then(function(r){
          if(r&&r.error){ dire(qtisAuthMsg(r.error.message),true); return; }
          dire('Mot de passe modifie. Vous etes connecte.');
        }).catch(function(e){ dire(String(e.message||e),true); });
      });
    } catch(e){}

    /* Connecteurs externes. Ils ouvrent la page du fournisseur puis reviennent
       ICI : onAuthStateChange reprend la main au retour, rien d'autre à faire.
       redirectTo doit pointer la page elle-même, sinon Supabase renvoie sur
       l'URL du site et l'utilisateur perd son chemin. */
    /* RETOUR du fournisseur. Supabase ne renvoie pas une exception : en cas de
       refus (fournisseur non activé dans Supabase, domaine de redirection non
       autorisé, consentement annulé), il REVIENT sur la page avec l'erreur dans
       le fragment d'URL — `#error=...&error_description=...`. Personne ne le
       lisait. Du point de vue de l'utilisateur, cliquer sur « Continuer avec
       Apple » ne faisait donc « rien » : aller-retour invisible, aucun message.
       On lit le fragment au chargement, on le dit, puis on le nettoie — sinon
       l'erreur ressort à chaque rafraîchissement. */
    (function(){
      var h=String(location.hash||'').replace(/^#/,''); if(!h) return;
      var p={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); });
      if(!p.error && !p.error_description) return;
      dire('Connexion refusée par le fournisseur : ' + (p.error_description || p.error)
         + ' — vérifiez que ce fournisseur est activé dans Supabase et que l’adresse de cette page figure dans les URL de redirection autorisées.', true);
      try { history.replaceState(null,'',location.pathname+location.search); } catch(e){}
    })();

    var provs=root.querySelectorAll('[data-prov]');
    Array.prototype.forEach.call(provs,function(b){
      b.addEventListener('click',function(ev){
        ev.preventDefault();
        dire('Redirection…');
        var prov=b.getAttribute('data-prov');
        /* On NE navigue PAS à l'aveugle. Si le fournisseur n'est pas activé
           côté Supabase, `/authorize` répond 400 + JSON ; une navigation
           directe REMPLACE le site par ce JSON brut
           (« Unsupported provider: provider is not enabled ») — l'utilisateur
           perd sa page et lit un message de développeur.
           On demande donc l'URL sans naviguer, on la sonde, et on ne part que
           si le serveur redirige vraiment. En cas de doute (CORS, réseau) on
           navigue quand même : la sonde ne doit jamais empêcher un cas qui
           marchait. */
        cli.auth.signInWithOAuth({
          provider:prov,
          options:{redirectTo:location.href.split('#')[0], skipBrowserRedirect:true}
        }).then(function(r){
          if(r&&r.error){ dire(qtisAuthMsg(r.error.message),true); return; }
          var url=r&&r.data&&r.data.url;
          if(!url){ dire('Le fournisseur n’a pas renvoyé d’adresse de connexion.',true); return; }
          function partir(){ location.href=url; }
          function refus(txt){
            var m=txt; try{ var j=JSON.parse(txt); m=j.msg||j.error_description||j.error||txt; }catch(e){}
            if(/not enabled|unsupported provider/i.test(m)){
              dire('Le fournisseur « '+prov+' » n’est pas activé dans votre projet Supabase. '
                 + 'Ouvrez Authentication → Providers, activez-le, renseignez son identifiant et son secret, '
                 + 'puis ajoutez l’adresse de cette page dans les URL de redirection autorisées.',true);
              return;
            }
            dire('Connexion « '+prov+' » refusée : '+String(m).slice(0,200),true);
          }
          try {
            fetch(url,{redirect:'manual'}).then(function(rep){
              if(rep.type==='opaqueredirect'||rep.status===0||(rep.status>=300&&rep.status<400)){ partir(); return; }
              if(rep.status>=400){ return rep.text().then(refus); }
              partir();
            }).catch(partir);
          } catch(e){ partir(); }
        }).catch(function(e){ dire(String(e.message||e),true); });
      });
    });

    var sortir=root.querySelector('[data-qtis-logout]');
    if(sortir) sortir.addEventListener('click',seDeconnecter);
  }
function qtisChampFiche(c){
    var f=c.format||'texte', el;
    if(f==='zone'){ el=document.createElement('textarea'); el.rows=3; }
    else if(f==='choix'){
      el=document.createElement('select');
      var vide=document.createElement('option'); vide.value=''; vide.textContent='—'; el.appendChild(vide);
      (c.options||[]).forEach(function(o){ var op=document.createElement('option'); op.value=o; op.textContent=o; el.appendChild(op); });
    }
    else if(f==='multi'){
      /* Choix multiple : des cases, pas un <select multiple>. Le select
         multiple exige de savoir qu'il faut maintenir Ctrl — sur mobile il est
         a peu pres inutilisable, et sur un chantier on est sur mobile. */
      el=document.createElement('div');
      el.className='qtis-ff-multi';
      el.style.cssText='display:flex;flex-wrap:wrap;gap:10px;';
      (c.options||[]).forEach(function(o){
        var l=document.createElement('label');
        l.style.cssText='display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:400;';
        var cb=document.createElement('input'); cb.type='checkbox'; cb.value=o; cb.style.width='auto';
        l.appendChild(cb); l.appendChild(document.createTextNode(o)); el.appendChild(l);
      });
      el.__qtisLire=function(){
        var out=[]; var l=el.querySelectorAll('input[type=checkbox]');
        for(var i=0;i<l.length;i++) if(l[i].checked) out.push(l[i].value);
        return out;
      };
    }
    else if(f==='fichier'){
      el=document.createElement('div');
      el.className='qtis-ff-fichier';
      var inp=document.createElement('input'); inp.type='file';
      if(c.accept) inp.accept=c.accept;
      var nom=document.createElement('div');
      nom.style.cssText='color:#6b7280;font-size:.85rem;margin-top:4px;';
      inp.addEventListener('change',function(){
        var fi=inp.files&&inp.files[0];
        nom.textContent = fi ? (fi.name+' — '+(fi.size>1048576?(fi.size/1048576).toFixed(1)+' Mo':Math.round(fi.size/1024)+' Ko')) : '';
      });
      el.appendChild(inp); el.appendChild(nom);
      /* La valeur definitive n'est connue qu'APRES le depot (elle contient le
         chemin). On ne rend donc rien ici : c'est `enregistrer` qui remplace
         par { chemin, nom, type, taille } une fois le fichier monte. */
      el.__qtisLire=function(){ return null; };
      el.__qtisFichier=function(){
        var fi=inp.files&&inp.files[0];
        return fi ? { nom:fi.name, type:fi.type||'application/octet-stream', blob:fi } : null;
      };
    }
    else if(f==='signature'){
      /* Signature manuscrite : c'est ce qui transforme un constat en document
         accepte. Trace au doigt sur tablette, a la souris sur ordinateur. */
      el=document.createElement('div');
      el.className='qtis-ff-signature';
      var cv=document.createElement('canvas');
      cv.width=600; cv.height=200;
      cv.style.cssText='border:1px dashed #cbd5e1;border-radius:8px;width:100%;max-width:420px;'
        +'height:auto;touch-action:none;background:#fff;display:block;cursor:crosshair;';
      var ct=cv.getContext('2d');
      ct.lineWidth=2; ct.lineCap='round'; ct.strokeStyle='#111';
      var trace=false, vide=true;
      function pos(e){
        var r=cv.getBoundingClientRect();
        var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
        var y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
        /* Le canvas est affiche a une taille CSS differente de sa taille reelle :
           sans ce rapport, le trait suivrait le doigt avec un decalage croissant. */
        return { x:x*(cv.width/r.width), y:y*(cv.height/r.height) };
      }
      function debut(e){ e.preventDefault(); trace=true; vide=false; var p=pos(e); ct.beginPath(); ct.moveTo(p.x,p.y); }
      function bouge(e){ if(!trace) return; e.preventDefault(); var p=pos(e); ct.lineTo(p.x,p.y); ct.stroke(); }
      function fin(){ trace=false; }
      cv.addEventListener('mousedown',debut); cv.addEventListener('mousemove',bouge);
      cv.addEventListener('mouseup',fin); cv.addEventListener('mouseleave',fin);
      cv.addEventListener('touchstart',debut); cv.addEventListener('touchmove',bouge);
      cv.addEventListener('touchend',fin);
      var eff=document.createElement('button');
      eff.type='button'; eff.textContent='Effacer';
      eff.style.cssText='margin-top:6px;background:none;border:1px solid #e5e7eb;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;';
      eff.addEventListener('click',function(){ ct.clearRect(0,0,cv.width,cv.height); vide=true; });
      el.appendChild(cv); el.appendChild(eff);
      el.__qtisLire=function(){ return null; };
      el.__qtisFichier=function(){
        /* Une signature vide ne doit rien deposer : sinon chaque fiche
           enregistree sans signature creerait une image blanche, et le champ
           « signee » deviendrait toujours vrai. */
        if(vide) return null;
        var d=cv.toDataURL('image/png');
        var b64=d.split(',')[1], bin=atob(b64), n=bin.length, arr=new Uint8Array(n);
        for(var i=0;i<n;i++) arr[i]=bin.charCodeAt(i);
        return { nom:'signature.png', type:'image/png', blob:new Blob([arr],{type:'image/png'}) };
      };
      el.__qtisVide=function(){ return vide; };
    }
    else if(f==='oui_non'){ el=document.createElement('input'); el.type='checkbox'; }
    else {
      el=document.createElement('input');
      el.type = f==='nombre'?'number' : f==='date'?'date' : f==='email'?'email'
              : f==='tel'?'tel' : f==='url'?'url' : 'text';
    }
    el.className=(el.className?el.className+' ':'')+'qtis-ff-champ';
    el.setAttribute('data-cle',c.cle);
    el.setAttribute('data-format',f);
    /* `required` sur un div n'a aucun effet : l'obligation de ces trois formats
       est verifiee a la lecture, pas par le navigateur. */
    if(c.obligatoire && el.tagName!=='DIV') el.required=true;
    return el;
  }
function qtisDeposerChamps(cli,uid,projet,liste){
    if(!liste||!liste.length) return Promise.resolve({});
    var out={};
    return liste.reduce(function(chaine,it){
      return chaine.then(function(){
        var f=it.fichier;
        var chemin=uid+'/'+(projet||'sans-projet')+'/'+Date.now()+'-'
          +Math.random().toString(36).slice(2,8)+'-'+String(f.nom||'piece').replace(/[^\w.\-]+/g,'_');
        return cli.storage.from('pieces').upload(chemin,f.blob,{contentType:f.type})
          .then(function(r){
            if(r.error) throw r.error;
            out[it.cle]={ chemin:chemin, nom:f.nom, type:f.type, taille:(f.blob&&f.blob.size)||0 };
          });
      });
    },Promise.resolve()).then(function(){ return out; });
  }
function qtisValeurLisible(v,c,cli,dest){
    var f=(c&&c.format)||'texte';
    if(v==null||v===''){ dest.textContent='—'; return; }
    if(f==='multi'){
      dest.textContent = (Object.prototype.toString.call(v)==='[object Array]') ? v.join(', ') : String(v);
      return;
    }
    if((f==='fichier'||f==='signature') && v && v.chemin){
      if(!cli){ dest.textContent=v.nom||'(piece jointe)'; return; }
      dest.textContent='…';
      /* URL SIGNEE, valable une heure : le bucket est prive. Une URL publique
         serait plus simple et resterait valable indefiniment, y compris apres
         le depart de la personne qui l'a copiee. */
      cli.storage.from('pieces').createSignedUrl(v.chemin,3600).then(function(u){
        var url=u&&u.data&&u.data.signedUrl;
        if(!url){ dest.textContent=v.nom||'(piece jointe)'; return; }
        dest.textContent='';
        if(/^image\//.test(v.type||'') || /\.(png|jpe?g|webp|gif|avif)$/i.test(v.nom||'') || /\.(png|jpe?g|webp|gif|avif)$/i.test(v.chemin||'')){
          var im=document.createElement('img'); im.src=url; im.alt=v.nom||'';
          im.style.cssText='max-width:260px;border:1px solid #e5e7eb;border-radius:6px;display:block;';
          dest.appendChild(im);
        } else {
          var a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
          a.textContent=v.nom||'Ouvrir le document';
          dest.appendChild(a);
        }
      }).catch(function(){ dest.textContent=v.nom||'(piece jointe indisponible)'; });
      return;
    }
    if(v && typeof v==='object'){ dest.textContent = v.nom || '\u2014'; return; }
    dest.textContent = v===true?'oui' : v===false?'non' : String(v);
  }
function qtisResDeCfg(cfg,texte,donnees){

    try{
      qtisResEnregistrer(null,{ module:cfg.resModule||'', blocId:cfg.resBloc||'',
        titre:cfg.resTitre||'', texte:String(texte), donnees:donnees||{},
        exigeFiche:!!cfg.resExigeFiche });
    }catch(e){}

function qtisDateLocale(v,avecHeure){

function qtisFileVider(cfg,blobs){
    cfg=cfg||window.__QTIS_RES_CFG||{};
    var l=qtisFileLire();
    if(!l.length) return Promise.resolve(true);
    var cli=qtisSb(cfg);
    if(!cli){ qtisResDire('Enregistrement indisponible : Supabase n’est pas configuré pour cette page.','ko'); return Promise.resolve(false); }
    if(window.__QTIS_FILE_ENCOURS) return Promise.resolve(false);
    window.__QTIS_FILE_ENCOURS=1;

    return cli.auth.getUser().then(function(u){
      var uid=u&&u.data&&u.data.user&&u.data.user.id;
      if(!uid) throw new Error('non-connecte');
      var reste=qtisFileLire();
      function suivante(){
        if(!reste.length) return Promise.resolve(true);
        var item=reste[0];
        var pj = blobs && reste.length===1 ? blobs : null;   // les blobs ne valent que pour l'envoi immédiat
        return qtisResFichiers(cli,uid,item.ligne.projet_id,pj).then(function(fichiers){
          var ligne={}; for(var k in item.ligne) ligne[k]=item.ligne[k];
          ligne.fichiers=fichiers;
          return cli.from('app_resultats').insert(ligne);
        }).then(function(r){
          /* 23505 = violation d'unicité : la ligne EXISTE déjà côté serveur.
             C'est le cas normal d'un renvoi après réponse perdue, pas une
             erreur. La traiter comme un échec ferait boucler la file. */
          if(r.error && r.error.code!=='23505') throw r.error;
          reste.shift(); qtisFileEcrire(reste);
          return suivante();
        });
      }
      return suivante();
    }).then(function(){
      qtisResDire('Résultat enregistré ✓','ok');
      return true;
    }).catch(function(e){
      var m=String((e&&e.message)||e);
      qtisResDire(m==='non-connecte'
        ? 'Connectez-vous pour enregistrer le résultat. Il est gardé en attente.'
        : 'Réseau indisponible : le résultat est gardé et repartira tout seul dès la reconnexion.','ko');
      return false;
    }).then(function(ok){
      window.__QTIS_FILE_ENCOURS=0;
      qtisFileBadge();

    });
  }

      var liste=(cfg.champs&&cfg.champs.length)?cfg.champs:cols;
      liste.forEach(function(c){
        var v=(f.valeurs||{})[c.cle];
        var dt=document.createElement('dt');
        dt.textContent=c.libelle||c.cle;
        dt.style.cssText='color:#6b7280;font-size:.8rem;margin-top:10px;';
        var dd=document.createElement('dd');
        dd.style.cssText='margin:2px 0 0;white-space:pre-wrap;';
        qtisValeurLisible(v,c,cli,dd);
        dl.appendChild(dt); dl.appendChild(dd);
      });
      var dtd=document.createElement('dt');
      dtd.textContent='Créée le'; dtd.style.cssText='color:#6b7280;font-size:.8rem;margin-top:10px;';
      var ddd=document.createElement('dd');
      ddd.style.cssText='margin:2px 0 0;'; ddd.textContent=qtisDateLocale(f.created_at);
      dl.appendChild(dtd); dl.appendChild(ddd);
      bo.appendChild(dl);

      /* Les RÉSULTATS rattachés à cette opération : analyses photo, réponses
         de modules, tout ce qui a été produit à propos d'elle. C'est le geste
         naturel — « j'ouvre cette opération, je vois ce qui s'y rattache » —
         et c'est ce qui rend le rattachement utile plutôt que théorique. */
      var zr=document.createElement('div'); zr.style.cssText='margin-top:18px;border-top:1px solid #eee;padding-top:12px;';
      var tr2=document.createElement('div'); tr2.style.cssText='font-weight:700;margin-bottom:8px;';
      tr2.textContent='Analyses et résultats'; zr.appendChild(tr2);
      var zl=document.createElement('div'); zl.textContent='Chargement…'; zl.style.color='#6b7280'; zr.appendChild(zl);
      bo.appendChild(zr);
      qtisResListe(cli,f.pk,zl);

      ov.appendChild(bo);
      function fermerVue(){ if(ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown',ech); }
      /* Échap et clic sur le fond : une fenêtre sans sortie évidente se referme
         mal, surtout au clavier. */
      function ech(e){ if(e.key==='Escape') fermerVue(); }
      fe.addEventListener('click',fermerVue);
      ov.addEventListener('mousedown',function(e){ if(e.target===ov) fermerVue(); });
      document.addEventListener('keydown',ech);
      document.body.appendChild(ov);
      fe.focus();
    }

    function rendre(l){
      if(!zone) return;
      if(!l.length){ zone.innerHTML='<div class="qtis-lf-vide">Aucune fiche.</div>'; return; }
      var t=document.createElement('table'); t.className='qtis-lf-t';
      /* Le squelette EXPORTE porte ce style en ligne ; ce tableau-ci le
         remplace des que les fiches arrivent, et ne reprenait que la classe.
         Or `.qtis-lf-t` n'est definie dans aucune feuille : le tableau perdait
         sa largeur et se retractait au contenu. L'apercu du studio, lui, pose
         le style en dur — d'ou un defaut invisible avant publication.
         Meme declaration des deux cotes : une seule apparence. */
      t.style.cssText='width:100%;border-collapse:collapse;font-size:13px;';
      var tr=document.createElement('tr');
      cols.forEach(function(c){ var th=document.createElement('th'); th.setAttribute('data-part','entete'); th.textContent=c.libelle||c.cle; tr.appendChild(th); });
      var thd=document.createElement('th'); thd.setAttribute('data-part','entete'); thd.textContent='Date'; tr.appendChild(thd);
      var thv=document.createElement('th'); thv.textContent=''; tr.appendChild(thv);
      t.appendChild(tr);
      l.forEach(function(f){
        var r=document.createElement('tr');
        cols.forEach(function(c){
          var td=document.createElement('td'); td.setAttribute('data-part','cellule');
          var v=(f.valeurs||{})[c.cle];
          /* Dans le TABLEAU, une piece jointe reste une mention courte : y
             afficher l'image ferait exploser la hauteur des lignes et
             declencherait une URL signee par cellule a chaque rendu. */
          if(c.format==='multi' && Object.prototype.toString.call(v)==='[object Array]') td.textContent=v.join(', ');
          else if((c.format==='fichier'||c.format==='signature') && v && v.chemin) td.textContent=v.nom||'piece jointe';
          else if(v && typeof v==='object') /* Filet : une valeur objet sans format connu (fiche ancienne, colonne    d'un projet publié avant) ne doit JAMAIS sortir en « [object Object] ». */ td.textContent = v.nom || (Object.prototype.toString.call(v)==='[object Array]' ? v.join(', ') : '—');
          else td.textContent = v===true?'oui' : v===false?'non' : (v==null?'':String(v));
          r.appendChild(td);
        });
        var td2=document.createElement('td');
        td2.textContent=qtisDateLocale(f.created_at,false);
        r.appendChild(td2);
        /* CONSULTATION. Le tableau ne montre que les colonnes choisies — quatre
           par défaut. Une fiche en compte souvent bien plus, dont la réponse
           QTIS, rangée elle aussi dans les valeurs. Sans ce bouton, tout ce qui
           n'est pas en colonne était saisi puis invisible : on écrivait dans un
           trou. Le geste est aussi porté par la LIGNE entière — c'est ce qu'on
           essaie d'abord — le bouton restant la cible explicite et accessible. */
        var tdV=document.createElement('td'); tdV.className='qtis-lf-actions';
        var bV=document.createElement('button');
        bV.type='button'; bV.className='qtis-lf-voir'; bV.setAttribute('data-part','voir');
        bV.setAttribute('aria-label','Voir la fiche');
        bV.title='Voir la fiche';
        bV.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        bV.style.cssText='background:none;border:0;padding:4px;cursor:pointer;color:#1a56db;line-height:0;';
        bV.addEventListener('click',function(ev){ ev.stopPropagation(); ouvrirFiche(f); });
        tdV.appendChild(bV); r.appendChild(tdV);
        r.style.cursor='pointer';
        r.addEventListener('click',function(){ ouvrirFiche(f); });
        t.appendChild(r);
      });
      zone.innerHTML=''; zone.appendChild(t);
    }

    /* La liste demande la session ELLE-MÊME, puis suit les changements.
       La première version se contentait d'écouter le bloc Connexion : sur une
       page qui n'en contient pas — un back-office atteint déjà connecté — la
       liste restait vide, sans le moindre message. Dépendre d'un autre bloc
       pour fonctionner est une dépendance de trop. */
    function etatSession(u){
      if(u) charger();
      else if(zone) zone.innerHTML='<div class="qtis-lf-vide">Connectez-vous pour voir les fiches.</div>';
    }
    cli.auth.getSession().then(function(r){ etatSession(r&&r.data&&r.data.session&&r.data.session.user); })
      .catch(function(){ etatSession(null); });
    window.addEventListener('qtis:session',function(e){ etatSession(e.detail); });
  }
